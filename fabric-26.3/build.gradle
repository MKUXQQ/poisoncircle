plugins {
    id 'net.fabricmc.fabric-loom' version '1.19.3'
}
version = '1.0.1+26.3'
group = 'com.poisoncircle'
base { archivesName = 'poisoncircle-fabric' }
repositories { mavenCentral() }
loom {
    splitEnvironmentSourceSets()
    mods {
        poisoncircle {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}
dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    implementation 'net.fabricmc:fabric-loader:0.20.1'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.165.0+26.3'
    // Optional Xaero APIs are compile-only; they are never bundled in this mod.
    clientCompileOnly fileTree('compile-libs') { include '*.jar' }
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
test { useJUnitPlatform() }
